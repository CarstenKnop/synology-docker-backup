name: build

# Runs on Windows because the app project targets net10.0-windows for WPF. Core and its
# tests are plain net10.0 and would build anywhere, but the solution builds as a whole.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SshDockerBackup.slnx

      - name: Build
        run: dotnet build SshDockerBackup.slnx --no-restore --configuration Release

      # The suite covers the pure helpers only: shell quoting, image-reference comparison,
      # source classification, exclusion matching, manifest sizing and the synowebapi
      # response parser. No NAS or network is involved, so it runs anywhere in a second.
      - name: Test
        run: dotnet test SshDockerBackup.slnx --no-build --configuration Release --verbosity normal
