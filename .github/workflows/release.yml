name: release

# Cutting a release is pushing a tag:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# The binaries are then built from the tagged source on a clean runner rather than
# from whatever happens to be on someone's machine, which is the whole point.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: v
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building $V"

      # Never ship a build whose tests do not pass.
      - name: Test
        run: dotnet test SshDockerBackup.slnx --configuration Release

      # Framework-dependent on purpose. A self-contained WPF build is ~140 MB because
      # WPF cannot be trimmed, and shipping the runtime inside every release means
      # shipping its security fixes too. Microsoft's installer keeps itself patched.
      - name: Publish
        run: >
          dotnet publish src/SshDockerBackup.App/SshDockerBackup.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.v.outputs.version }}
          -o publish/app

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          New-Item -ItemType Directory dist | Out-Null

          Compress-Archive -Path publish/app/* -DestinationPath "dist/SshDockerBackup-$v-win-x64.zip"

          # Checksums matter more than usual here: the binaries are unsigned, so this
          # is the only way a downloader can confirm they got what was published.
          Get-ChildItem dist/*.zip | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Append -Encoding ascii dist/SHA256SUMS.txt
          }

          Get-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Select-Object Name, Length

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          cat > notes.md <<'EOF'
          ### Install

          **1. Get the .NET 10 Desktop Runtime**, if you do not already have it — it is a small
          Microsoft installer, and *Desktop* matters: the plain .NET Runtime does not include WPF.

          ```powershell
          winget install Microsoft.DotNet.DesktopRuntime.10
          ```

          Or download it from
          [dotnet.microsoft.com/download/dotnet/10.0](https://dotnet.microsoft.com/download/dotnet/10.0)
          — pick **.NET Desktop Runtime**, **x64**.

          **2. Unzip and run** `SshDockerBackup.exe`. Nothing is installed, nothing runs in the
          background, and deleting the exe uninstalls it. Settings live in `%APPDATA%`, logs in
          `%LOCALAPPDATA%`.

          If the runtime is missing, Windows says so on launch and offers the download link.

          ### Windows will warn you

          The executable is not code-signed, so SmartScreen shows **"Windows protected your PC"**
          on first run. Choose **More info → Run anyway**. If you would rather verify before
          trusting it, compare the download against `SHA256SUMS.txt`:

          ```powershell
          Get-FileHash .\SshDockerBackup-*.zip -Algorithm SHA256
          ```

          ### Before you rely on it

          Test a restore onto something you do not mind losing. This tool writes archives over live
          paths and recreates containers, so a mistake costs data.
          EOF

          gh release create "v$V" dist/* \
            --title "v$V" \
            --notes-file notes.md
